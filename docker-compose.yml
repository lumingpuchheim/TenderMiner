# TenderMining — the cycle, containerised. doc/STORAGE.md 6.5.
#
#   docker compose build
#   docker compose run --rm tm python cycle.py run --last 7d
#   docker compose run --rm tm python deliver.py run
#   docker compose run --rm tm python -m unittest discover -t . -s tests
#
# Compose exists here for one reason: to write the two mounts down once. The
# image itself needs nothing from this file — the equivalent plain `docker run`
# is in doc/RUNBOOK.md §1b, and it is what a host like Render or Railway runs.

name: tendermining

services:
  tm:
    build: .
    # On the laptop this is `latest` and `docker compose build` fills it. On the
    # server every deploy is an immutable git-SHA tag and TM_TAG selects which
    # one runs — that indirection is the whole rollback mechanism
    # (doc/OPERATIONS.md 2, docker/deploy.sh). Never retag an existing tag: the
    # artifact that served yesterday has to still exist, unchanged, to go back to.
    image: tendermining:${TM_TAG:-latest}
    init: true                       # so Ctrl-C reaches python, not PID 1
    environment:
      # Which day the container thinks it is; the download window and the
      # dated receipts depend on it. Default is the operator's laptop zone.
      TZ: ${TM_TZ:-Europe/Bucharest}
      # Sidecar tag — a model change is a new directory and a full re-embed,
      # never an in-place mutation (embed.py). Flipping it here flips it for
      # the whole cycle, which is the only way it should ever be flipped.
      EMBED_MODEL: ${EMBED_MODEL:-jina-v2-base-de}
      # The nightly off-site backup (docker/nightly.sh). Empty until the
      # operator fills .env — the backup then says so every night rather than
      # failing quietly.
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # E-mail (mailer.py): the Resend key and the verified sender. Both the
      # app (signup confirmation) and the cycle (the weekly report,
      # delivering.py) send, and both extend this service. Empty = the mail
      # is refused loudly and ledgered; nothing pretends to send.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      TM_MAIL_FROM: ${TM_MAIL_FROM:-}
      # Where the token links in every mail point (doc/APP.md 2).
      TM_APP_URL: ${TM_APP_URL:-https://app.murara.eu}
      # The yes-page (doc/ONBOARDING.md 9.5): price line and payment link,
      # both empty until decided.
      TM_PRICE_LINE: ${TM_PRICE_LINE:-}
      TM_STRIPE_URL: ${TM_STRIPE_URL:-}
    volumes:
      # THE state directory. Defaults to ./data — today's behaviour, so a
      # container started in the checkout finds exactly what the laptop
      # finds. Point TM_STATE somewhere outside the checkout (an absolute
      # path, or a named volume) and nothing else has to change: that is
      # what 6.1 bought.
      - ${TM_STATE:-./data}:/data
      # The 309 MB embedding model. Its own volume, not part of the state:
      # it is a cache, it is re-downloadable, and a backup of /data should
      # not be 309 MB heavier for it.
      - model-cache:/models_cache

  # The weekly schedule, Monday 08:15 — the container equivalent of the Windows
  # task "TenderMining weekly loop". Not started by `up` unless asked for:
  #
  #   docker compose up -d scheduler        # start it
  #   docker compose logs -f scheduler      # watch it
  #   docker compose stop scheduler         # stand it down
  #
  # Read doc/RUNBOOK.md §1c before turning this on alongside the Windows task.
  # Two schedulers appending to the same ledgers is worse than either alone.
  scheduler:
    extends: tm
    profiles: ["scheduler"]
    # cron is the one thing here that needs root: it drops to `tm` per job (see
    # the user field in docker/crontab), so the cycle itself still runs as 1000.
    user: root
    # cron daemonises, then `tail -F` becomes the foreground process and streams
    # the job's own output to `docker compose logs`. The tail is what keeps the
    # container alive, and -F (not -f) means it does not care that cron.log does
    # not exist until the first Monday.
    #
    # Why not `cron -f` alone: cron's -L flag logs to syslog, which no container
    # has, and a job's stdout goes to the mail spool, which no container has
    # either. Run that way the service looks perfectly healthy and reports
    # nothing, ever. See the comment in docker/crontab.
    #
    # The env dump: cron hands its jobs a bare environment, so the secrets
    # compose read from .env (RESTIC_*, AWS_*, RESEND_*) would never reach
    # nightly.sh or deliver.sh.
    # They are written once at container start to a file only `tm` can read,
    # and nightly.sh sources it. The file lives under /data so it never lands
    # in an image layer; it is rewritten on every recreate, so a rotated .env
    # value takes effect at the next deploy.
    # `export -p`, not `env`: it emits shell-quoted lines, so a password with
    # a space survives the round trip into nightly.sh's `.`.
    command: ["sh", "-c",
              "umask 077 && { export -p | grep -E '^export (RESTIC_|AWS_|RESEND_|TM_MAIL_FROM|TM_APP_URL)' || true; } > /data/.cron-env && chown tm:tm /data/.cron-env && cron -L 2 && exec tail -F /data/logs/cron.log"]
    restart: unless-stopped

  # The customer-facing app (doc/APP.md). Same image, same /data — it reads the
  # database per request, so a data change never needs a deploy and only a code
  # change does (APP.md 9).
  #
  #   docker compose up -d app          # then http://localhost:8000/
  #
  # Not behind a profile, unlike the scheduler: two schedulers writing the same
  # ledgers is a hazard, whereas two readers are not, and the app is meant to
  # answer around the clock — a customer clicks at 21:00 on a Sunday.
  app:
    extends: tm
    command: ["python", "app.py", "--port", "8000"]
    ports:
      # Loopback by default, and that default is load-bearing: Docker writes
      # its own iptables rules AHEAD of any host firewall, so a bare
      # "8000:8000" is the whole internet, whatever ufw says. The app's spec
      # forbids it facing the internet directly (APP.md 9) — TLS terminates in
      # the edge service, which reaches the app over the compose network and
      # needs no host port at all. Set TM_APP_BIND=0.0.0.0 only on a machine
      # where exposing plain HTTP is the deliberate point.
      - "${TM_APP_BIND:-127.0.0.1}:${TM_APP_PORT:-8000}:8000"
    # APP.md 9: app down = forms fail visibly, while picks, grading and report
    # generation carry on inside the cycle. So: restart hard, and let /healthz
    # be what says whether it came back.
    restart: always
    # This asks "is the process serving", nothing more — so 503 counts as
    # healthy here. /healthz's 200-vs-503 semantics (stale cycle, full disk)
    # belong to the uptime pinger and the deploy gate; if Docker read them too,
    # every fresh deployment would sit "unhealthy" until its first cycle, and a
    # full disk would look like a crashed app. http.client, not urllib: it
    # reports status codes instead of raising on them.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import http.client; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=4); c.request('GET','/healthz'); exit(0 if c.getresponse().status in (200,503) else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    # TLS is terminated in front (APP.md 9): the `edge` service below. The app
    # must never be the thing facing the internet directly.

  # TLS edge (doc/HOSTING.md §2 no.5). Behind a profile: on the laptop there is
  # no reason to hold ports 80/443, on the server it starts alongside the app:
  #
  #   TM_DOMAIN=app.example.de docker compose --profile edge up -d app edge
  #
  # Without TM_DOMAIN it serves a self-signed certificate on :443 — good enough
  # to test the full path on a bare IP before the domain decision lands.
  edge:
    image: caddy:2
    profiles: ["edge"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      TM_DOMAIN: ${TM_DOMAIN:-}
      TM_WWW_DOMAIN: ${TM_WWW_DOMAIN:-}
    # No TM_ADMIN_* anywhere here — not in `environment:`, not in
    # `env_file:`. The admin credential does not travel through compose at
    # all any more (doc/ADMIN.md §5c): the edge imports it from a file it
    # re-reads on every `caddy reload`, so the file is the only truth and a
    # recreate can no longer put a different password in force than the one
    # that was already running. Two bugs die with that: the environment
    # snapshot frozen at container creation, and the `$`-doubling this file's
    # interpolation forced on every bcrypt hash.
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # The operator's credential, one file, read-only, the edge's alone.
      # A DIRECTORY, not the file: `admin-password.sh` replaces it with a
      # rename, and a single-file bind mount would still point at the old
      # inode. Missing on this machine (a laptop) is fine — the Caddyfile's
      # import glob then matches nothing and /admin refuses every password.
      - ${TM_CADDY_D:-/etc/murara/caddy.d}:/etc/caddy/secrets:ro
      - caddy-data:/data          # certificates survive the container
      # The public site, written by every deploy and every weekly cycle,
      # served here as plain files (the Caddyfile serves `current/` inside
      # it — see there). Read-only: Caddy is a waiter, never a writer.
      - ${TM_STATE:-./data}/public:/srv/public:ro
    restart: always

volumes:
  caddy-data:
  model-cache:
    # Named explicitly rather than project-prefixed, so seeding it once from a
    # laptop's existing cache (doc/RUNBOOK.md §1b) survives a compose project
    # rename and is shared by plain `docker run`.
    name: tm-model-cache
